<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Recettes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Popup recette (existant) -->
    <script src="../static/js/popup-recette.js?v=2"></script>

    <!-- ORDRE CRITIQUE: Constants en premier -->
    <script type="text/babel" src="../static/js/utils/constants.js?v=2"></script>
    
    <!-- ENSUITE: API -->
    <script type="text/babel" src="../static/js/utils/api.js?v=2"></script>
    
    <!-- PUIS: ICONS (avant les composants!) -->
    <script type="text/babel" src="../static/js/utils/icons.js?v=2"></script>

    <script type="text/babel" src="../static/js/App.jsx?v=2"></script>

    <!-- Initialiser -->
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

</html>
